name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Builds the application into dist/app and the crawlable static site
      # into dist. A broken canonical or a page that fails to generate is a
      # silent failure in production, so it fails here instead.
      - name: Build
        run: npm run build
        env:
          SITE_ORIGIN: https://sat365.gita.edu.vn

      # The item bank is the one thing a code change can silently corrupt, so
      # its invariants are checked as a separate, named step: a failure here
      # means content is broken, not that a component regressed.
      - name: Bank integrity
        run: npm run check:bank

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # axe-core rides along with Playwright: both are test-only, and neither
      # belongs in the dependency graph of an application that ships with React
      # and nothing else.
      - name: Install Playwright, axe-core and Chromium
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Smoke test the built application
        run: npm run test:browser
