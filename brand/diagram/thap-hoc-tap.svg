<text x="190" y="840" font-family="Inter, sans-serif" font-size="21" font-weight="400" fill="#64748B">Càng lên cao, tỉ lệ ghi nhớ càng lớn — và học viên càng phải chủ động.</text>
<text x="190" y="872" font-family="Inter, sans-serif" font-size="21" font-weight="400" fill="#64748B">Mọi tầng dưới chỉ là đường dẫn tới tầng đỉnh: dạy lại cho người khác.</text>
