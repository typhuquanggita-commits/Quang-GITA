<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Chinh sach bao mat noi dung.

      Dong quan trong nhat la `connect-src`: no ghim moi ket noi ra ngoai ve dung
      mot dich — endpoint Gemini. Ke ca khi co ai chen duoc ma vao trang, du lieu
      hoc tap cung khong the gui di dau khac. `object-src`, `base-uri` va
      `form-action` deu dong lai vi ung dung nay khong dung den chung.

      `script-src` con 'unsafe-inline' vi doan dat chu de ben duoi phai chay
      TRUOC khi React dung cay, neu khong se nhay trang o che do toi. Day la
      danh doi co y thuc, khong phai bo sot: khi trien khai that co may chu, hay
      thay bang CSP gui qua header kem nonce cho dung doan script do.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self' https://generativelanguage.googleapis.com;
               worker-src 'self';
               manifest-src 'self';
               object-src 'none';
               base-uri 'self';
               form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <title>HSA365 — Luyện thi Đánh giá năng lực HSA</title>
    <meta
      name="description"
      content="HSA365: luyện thi Đánh giá năng lực HSA của ĐHQGHN theo lộ trình cá nhân hóa — đề thi thử chuẩn cấu trúc 150 câu/195 phút, phân tích năng lực và ôn tập ngắt quãng."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      The mac dinh. Cac trang duoc ket xuat tinh se co the rieng cua tung trang
      ghi de len day; nhung duong dan khong ket xuat van con mot mo ta tu te
      thay vi de trong.
    -->
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HSA365" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="HSA365 — Luyện thi Đánh giá năng lực HSA (ĐHQGHN)" />
    <meta
      property="og:description"
      content="Bài định vị đầu vào, lộ trình cá nhân hóa, 2.000 phiếu luyện, đề mẫu 150 câu kèm barem và kho bí kíp 90 dạng bài."
    />
    <meta property="og:image" content="/og-hsa365.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-hsa365.png" />
    <script>
      // Đặt chủ đề trước khi React dựng cây — tránh nháy trắng ở chế độ tối.
      (function () {
        try {
          var raw = localStorage.getItem('hsa365:state');
          var settings = raw ? (JSON.parse(raw).settings || {}) : {};
          var theme = settings.theme || 'system';
          var root = document.documentElement;
          if (theme === 'system') root.removeAttribute('data-theme');
          else root.setAttribute('data-theme', theme);
          // Chan trong dung khoang cua Cai dat: mot gia tri la trong localStorage
          // khong duoc phep lam co chu vo hinh hay tran man hinh.
          var scale = Number(settings.fontScale);
          if (scale >= 0.875 && scale <= 1.375) root.style.setProperty('--font-scale', String(scale));
          if (settings.reducedMotion) root.setAttribute('data-motion', 'reduced');
        } catch (e) {
          document.documentElement.removeAttribute('data-theme');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        HSA365 cần JavaScript để chạy bài thi và lưu tiến độ. Vui lòng bật JavaScript rồi tải lại trang.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
